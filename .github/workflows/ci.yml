name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dev tools (vitest, tsup, Prism) need Node 24; the package itself
      # supports Node 20 and up, which the smoke steps below check.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run tools

      - name: Generated code matches openapi.json
        run: npm run check:generated

      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Contract tests (Prism)
        run: npm run test:contract
      - name: next-version.sh tests
        run: npm run test:version
      - name: Package exports
        run: npm run check:package
      - name: Package contents
        run: npm pack --dry-run

      - name: Smoke on Node 24
        run: npm run smoke
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Smoke on Node 22
        run: node scripts/smoke.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Smoke on Node 20
        run: node scripts/smoke.mjs
